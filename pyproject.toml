[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppiss"
version = "0.1.0"
description = "A lightweight generative portrait status display for Raspberry Pi Zero W"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PPISS contributors" }]
dependencies = []

[project.optional-dependencies]
pi = ["pygame-ce>=2.5,<3"]
sender = ["psutil>=6,<8"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
ppiss-display = "ppiss.display:main"
ppiss-send = "ppiss.sender:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
